spring:
  application:
    name: stocksense-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksense}
    username: ${DB_USERNAME:stocksense}
    password: ${DB_PASSWORD:stocksense}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:defaultDevSecretKeyThatShouldBeChangedInProductionAndMustBeAtLeast256BitsLong!!}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  otp:
    delivery-mode: ${OTP_DELIVERY_MODE:DEMO}
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    com.stocksense: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
