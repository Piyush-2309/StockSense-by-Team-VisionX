spring:
  datasource:
    url: jdbc:h2:mem:stocksense_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

app:
  jwt:
    secret: testSecretKeyForUnitTestsThatMustBeAtLeast256BitsLongToWork!!
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  otp:
    delivery-mode: DEMO
    expiry-minutes: 5
    max-attempts: 5
    resend-cooldown-seconds: 60
  cors:
    frontend-origin: http://localhost:3000
